#
# LSD_OS! Limine Configuration for Live ISO
#

timeout: 5
interface_branding: LSD_OS! Live
term_font_scale: 1x1

/LSD_OS! Live (Linux CachyOS)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n

/LSD_OS! Live (Linux CachyOS, Copy to RAM)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y

/LSD_OS! Live (Linux CachyOS LTS)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n

/LSD_OS! Live (Linux CachyOS LTS, Copy to RAM)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y
