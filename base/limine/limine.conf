#
# LSD_OS! Limine Configuration for Live ISO
#

timeout: 5
interface_branding: LSD_OS! Live
term_font_scale: 1x1

/LSD_OS! (x86_64, UEFI)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n

/LSD_OS! (Copy to RAM)
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y
