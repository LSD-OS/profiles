# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Set default menu entry
default=lsdos-cachyos
timeout=5

# Menu entries
menuentry "LSD_OS! Live (Linux CachyOS)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos-cachyos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "LSD_OS! Live (Linux CachyOS, Copy to RAM)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos-cachyos-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "LSD_OS! Live (Linux CachyOS LTS)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos-cachyos-lts' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}

menuentry "LSD_OS! Live (Linux CachyOS LTS, Copy to RAM)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos-cachyos-lts-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}
