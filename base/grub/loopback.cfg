# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Set default menu entry
default=lsdos
timeout=5

# Menu entries
menuentry "LSD_OS! Live (x86_64, Loopback)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=n
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "LSD_OS! Live (Copy to RAM)" --class arch --class gnu-linux --class gnu --class os --id 'lsdos-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=8G copytoram=y
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
