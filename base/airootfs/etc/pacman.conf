#
# LSD_OS! pacman.conf
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
ParallelDownloads = 8
SigLevel          = Never
LocalFileSigLevel = Optional
IgnorePkg         = runit runit-rc s6 s6-rc openrc systemd-libs
Color
ILoveCandy

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

[lib32]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist-arch

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

# Repositório LSD_OS! (pacotes próprios do sistema)
[lsd]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/lsd-mirrorlist
